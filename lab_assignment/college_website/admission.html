<!DOCTYPE html>
<html lang="en">

<head>
  <title>Admission | GCET Jammu</title>
  <link rel="stylesheet" href="assets/style.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-main">
      <a class="logo-wrap" href="index.html"><img src="assets/college_images/college_logo.jpeg"
          alt="GCET Jammu logo"></a>
      <div class="brand">
        <h1>Govt. College of Engineering and Technology, Jammu</h1>
        <p>(Autonomous College)</p>
      </div>
    </div>



    <nav class="navbar">
      <div class="container nav">
        <a href="index.html" class="">Home</a>
        <a href="about.html" class="">About</a>
        <a href="faculty.html" class="">Faculty</a>
        <a href="students.html" class="">Students</a>
        <a href="gallery.html" class="">Gallery</a>
        <a href="admission.html" class="active">Admission</a>
        <a id="login" class="nav-logout" href="login.html">Login</a>
      </div>
    </nav>

  </header>

  <div class="page-banner">
    <div class="container">
      <h2>Student Admission</h2>
      <p>Fill in the form below to submit your enquiry.</p>
    </div>
  </div>
  <main>
    <div class="container">
      <section class="form-card card">
        <form onsubmit="event.preventDefault(); alert('Thank you! Your admission form has been submitted.');">
          <div class="form-grid">
            <div class="field"><label for="name">Full Name *</label><input id="name" name="name" required
                placeholder="Enter your name"></div>
            <div class="field"><label for="dob">Date of Birth *</label><input id="dob" name="dob" type="date" required>
            </div>
            <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required
                placeholder="Enter your email"></div>
            <div class="field"><label for="course">Course Applied For *</label><select id="course" required>
                <option value="">-- Select Course --</option>
                <option>B.Tech CSE</option>
                <option>B.Tech ECE</option>
                <option>B.Tech Mechanical</option>
                <option>B.Tech Civil</option>
                <option>B.Tech Electrical</option>
              </select></div>
            <div class="field"><label for="mobile">Mobile Number *</label><input id="mobile" name="mobile" type="tel"
                required placeholder="Enter mobile number"></div>
            <div class="field"><label for="hobbies">Hobbies</label><input id="hobbies" name="hobbies"
                placeholder="Reading, sports, coding..."></div>
            <div class="field full"><label>Gender *</label>
              <div class="radio-row">
                <label><input type="radio" name="gender" required> Male</label>
                <label><input type="radio" name="gender"> Female</label>
                <label><input type="radio" name="gender"> Other</label>
              </div>
            </div>
            <div class="field full"><label for="address">Address *</label><textarea id="address" required
                placeholder="Enter your address"></textarea></div>
            <div class="field full actions"><button class="btn" type="submit">Submit Application</button><button
                class="btn reset" type="reset">Reset</button></div>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 GCET Jammu. All Rights Reserved.</p>
      <p>Government College of Engineering and Technology, Jammu</p>
    </div>
  </footer>
</body>

</html>
