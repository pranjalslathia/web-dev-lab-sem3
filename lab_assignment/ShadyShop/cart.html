
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShadyShop - Cart</title>
  <link href="/src/output.css" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-800">

  <!-- Header -->
  <header class="flex flex-col gap-4 bg-green-600 px-6 py-5 text-white md:flex-row md:items-center md:justify-between">
    <div class="text-2xl font-bold tracking-wider">ShadyShop</div>
    <nav class="flex flex-wrap items-center gap-5 text-sm font-medium">
      <a href="index.html" class="hover:text-green-200">Home</a>
      <a href="products.html" class="hover:text-green-200">Products</a>
      <a href="index.html#categories" class="hover:text-green-200">Categories</a>
      <a href="about.html" class="hover:text-green-200">About Us</a>
      <a href="contact.html" class="hover:text-green-200">Contact Us</a>
      <a href="cart.html" class="rounded-lg bg-white px-5 py-2 font-semibold text-green-700">Cart</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="mx-auto min-h-screen max-w-7xl px-5 py-10">

    <h1 class="mb-8 text-3xl font-bold text-gray-900">
      Shopping Cart
    </h1>

    <div class="grid grid-cols-1 gap-8 lg:grid-cols-3">

      <!-- Cart Items -->
      <section id="cart-items" class="space-y-4 lg:col-span-2">
        <article class="product overflow-hidden rounded-xl border border-gray-100 bg-white shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-lg">
        <img src="images/p1.jpg" alt="Wireless Headphones" class="h-52 w-full object-cover">
        <div class="p-5">
          <h2 class="product-name text-lg font-bold">Wireless Headphones</h2>
          <p class="mt-2 text-2xl font-bold text-green-700">₹1,999</p>
          <p class="product-description mt-2 text-sm text-gray-500">Over-ear wireless headphones</p>
          <button
  type="button"
  class="mt-2 w-full rounded-lg bg-red-600 px-3 py-2 font-semibold text-white transition hover:bg-red-700 active:scale-95"
>
  Remove
</button>
      </section>

      <!-- Order Summary -->
      <aside id="summary" class="h-fit rounded-xl border bg-white p-6 shadow-sm">
        <h2 class="mb-6 text-xl font-bold">Order Summary</h2>

        <div class="flex justify-between py-3">
          <span>Subtotal</span>
          <span id="subtotal">₹0</span>
        </div>

        <div class="flex justify-between border-t py-4 font-bold">
          <span>Total</span>
          <span id="total">₹0</span>
        </div>

        <button
          id="checkout"
          class="mt-4 w-full rounded-lg bg-green-600 px-5 py-3 font-semibold text-white hover:bg-green-700">
          Checkout
        </button>

        <p id="message" class="mt-3 text-sm text-green-700"></p>

        <a href="products.html"   
           class="mt-4 block text-center font-semibold text-green-700 hover:underline">
          Continue Shopping
        </a>
      </aside>

    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 px-5 py-8 text-center text-gray-300">
    <p>&copy; 2026 ShadyShop. All rights reserved.</p>
  </footer>

  <script>
    // Sample cart products
    let cart = JSON.parse(localStorage.getItem("shadyshop-cart")) || [
      {
        id: 1,
        name: "Wireless Headphones",
        price: 1999,
        quantity: 1,
        image: "images/p1.jpg"
      },
      {
        id: 2,
        name: "Smart Watch",
        price: 2499,
        quantity: 1,
        image: "images/p2.jpg"
      }
    ];

    function saveCart() {
      localStorage.setItem("shadyshop-cart", JSON.stringify(cart));
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cart-items");
      const summary = document.getElementById("summary");

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="rounded-xl bg-white p-10 text-center shadow-sm">
            <h2 class="text-xl font-bold">Your cart is empty</h2>
            <p class="mt-2 text-gray-500">
              Add some products to get started.
            </p>
            <a href="products.html"
               class="mt-5 inline-block rounded-lg bg-green-600 px-5 py-3 text-white hover:bg-green-700">
              Browse Products
            </a>
          </div>
        `;

        summary.classList.add("hidden");
        return;
      }

      summary.classList.remove("hidden");

      container.innerHTML = cart.map(item => `
        <div class="flex flex-col gap-4 rounded-xl border border-gray-100 bg-white p-4 shadow-sm sm:flex-row sm:items-center">

          <img src="${item.image}"
               alt="${item.name}"
               class="h-24 w-full rounded-lg object-cover sm:w-28"
               onerror="this.style.display='none'">

          <div class="flex-1">
            <h2 class="font-bold text-gray-900">${item.name}</h2>
            <p class="mt-2 text-green-700">
              ₹${item.price.toLocaleString("en-IN")}
            </p>

            <button onclick="removeItem(${item.id})"
                    class="mt-2 text-sm text-red-600 hover:underline">
              Remove
            </button>
          </div>

          <div class="flex items-center gap-3">
            <button onclick="changeQuantity(${item.id}, -1)"
                    class="rounded border px-3 py-1 hover:bg-gray-100">
              −
            </button>

            <span class="font-semibold">${item.quantity}</span>

            <button onclick="changeQuantity(${item.id}, 1)"
                    class="rounded border px-3 py-1 hover:bg-gray-100">
              +
            </button>
          </div>

          <p class="font-bold">
            ₹${(item.price * item.quantity).toLocaleString("en-IN")}
          </p>

        </div>
      `).join("");

      calculateTotal();
    }

    function changeQuantity(id, change) {
      const item = cart.find(product => product.id === id);

      if (!item) return;

      item.quantity += change;

      if (item.quantity <= 0) {
        cart = cart.filter(product => product.id !== id);
      }

      saveCart();
    }

    function removeItem(id) {
      cart = cart.filter(product => product.id !== id);
      saveCart();
    }

    function calculateTotal() {
      const subtotal = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
      );

      document.getElementById("subtotal").textContent =
        "₹" + subtotal.toLocaleString("en-IN");

      document.getElementById("total").textContent =
        "₹" + subtotal.toLocaleString("en-IN");
    }

    document.getElementById("checkout").addEventListener("click", () => {
      document.getElementById("message").textContent =
        cart.length
          ? "Checkout is a demo. Connect a payment system to accept orders."
          : "Your cart is empty.";
    });

    renderCart();
  </script>

</body>
</html>
