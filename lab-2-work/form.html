<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admission Form</title>
</head>
<body>
    <h1 align="center">Jammu & Kashmir Technical University</h1>

    <div align="center">
        <img src="images/school-of-athens.jpg" alt="JKTU" width="80%"">
    </div>
    
    <div>
        
    </div>
    
    <form autocomplete="off" action="./timetable.html">

        <hr><b></b>

        <h2 align="center"><b>ADMISSION FORM</b></h2>

        <hr>

        <h3>Personal Information</h3>

        <label for="name"><b>Full Name:</b></label>
        <input type="text" name="name" required>

        <br><br>

        <label for="dob"><b>DOB:</b></label>
        <input required type="date" name="dob">

        <br><br>

        <label for="gender"><b>Gender:</b></label>
        <input type="radio" name="gender">
        <label for="gender">Male</label>
        <input type="radio" name="gender">
        <label for="gender">Female</label>
        <input type="radio" name="gender">
        <label for="gender">Other</label>

        <br><br>

        <label for="photo"><b>Photograph:</b></label>
        <input type="file" name="photo" accept=".jpg,.png,.pdf">

        <hr>
        
        <h3>Contact Information</h3>

        <label for="email"><b>Email:</b></label>
        <input type="email" name="email">
        <br><br>
        <label for="number"><b>Mobile Number:</b></label>
        <input type="tel" name="number" required>
        <br><br>
        <label for="address"><b>Address:</b></label>
        <input type="text" name="address" required>
        <br><br>
        <label for="city"><b>City:</b></label>
        <input type="text" name="city">
        <br><br>
        <label for="state"><b>State</b></label>
        <input type="text" name="state">
        <br><br>
        <label for="pincode"><b>Pincode</b></label>
        <input type="text" name="pincode">

        <hr>

        <h3>Academic Information</h3>

        <p><b>Subjects:</b></p>
        <input type="checkbox" name="subject">
        <label for="subject">LLMs</label>
        <input type="checkbox" name="subject">
        <label for="subject">MAthematics</label>
        <input type="checkbox" name="subject">
        <label for="subject">C++</label>
        <input type="checkbox" name="subject">
        <label for="subject">Python</label>
        <input type="checkbox" name="subject">
        <label for="subject">Digital Systems</label>
        <input type="checkbox" name="subject">
        <label for="subject">Economics</label>
        <input type="checkbox" name="subject">
        <label for="subject">Biology</label>

        <hr>

        <h3>Declaration</h3>
        <input type="checkbox" name="decleration" required>
        <label for="decleration">I hereby declare that I am desperate to get an admission in this university.</label>

        <div align="center">
            <input type="submit" value="Submit">

        </div>
    </form>

    <div align="center">
        <p>~ Admission Office</p>
        <a href="">Visit Us</b>
    </div> 
</body>
</html>
